\r\n```\r\n\r\n---\r\n\r\n### 2. Install `gh-pages`\r\n\r\nYou’ll need the `gh-pages` package to deploy the `out` folder to your GitHub Pages branch.\r\n\r\nInstall it with:\r\n\r\n```bash\r\nnpm install --save-dev gh-pages\r\n```\r\n\r\nThis tool will handle publishing your static site to the correct branch (typically `gh-pages` or `main`).\r\n\r\n---\r\n\r\n### 3. Update `next.config.js`\r\n\r\nConfigure your app for static export:\r\n\r\n```js\r\n/** @type {import('next').NextConfig} */\r\nconst nextConfig = {\r\n  output: 'export', // Static export for GitHub Pages\r\n  basePath: '',     // Leave empty for username.github.io\r\n};\r\n\r\nmodule.exports = nextConfig;\r\n```\r\n\r\n\u003e If you're deploying to a **project page** (e.g., `username.github.io/my-app`), set:\r\n\u003e\r\n\u003e ```js\r\n\u003e basePath: '/my-app',\r\n\u003e assetPrefix: '/my-app',\r\n\u003e ```\r\n\r\n---\r\n\r\n### 4. Update your `package.json` scripts\r\n\r\nHere's what your scripts should look like:\r\n\r\n```json\r\n\"scripts\": {\r\n  \"dev\": \"next dev\",\r\n  \"build\": \"next build\",\r\n  \"export\": \"next export\",\r\n  \"postexport\": \"shx touch out/.nojekyll\",\r\n  \"deploy\": \"next build \u0026\u0026 npm run postexport \u0026\u0026 gh-pages -d out --nojekyll --cname https://yourusername.github.io\"\r\n}\r\n```\r\n\r\n\u003e 📝 Replace `https://yourusername.github.io` with your own domain or GitHub Pages URL.\r\n\r\nThis setup:\r\n- Builds your app.\r\n- Exports it to the `out` folder.\r\n- Adds the `.nojekyll` file.\r\n- Deploys it with `gh-pages`.\r\n\r\n---\r\n\r\n## 🏁 Deployment Command\r\n\r\nNow you can deploy your app with:\r\n\r\n```bash\r\nnpm run deploy\r\n```\r\n\r\nBoom 💥 — your Next.js site should be live and functional on GitHub Pages!\r\n\r\n---\r\n\r\n## 🔄 Choosing the GitHub Pages Branch\r\n\r\nIf you’re using GitHub Pages, you need to **set the correct branch** in your repository settings:\r\n\r\n1. Go to your repository on GitHub.\r\n2. Click on **Settings** → **Pages** (left sidebar).\r\n3. Under **\"Build and deployment\"**, choose:\r\n   - **Source:** `Deploy from a branch`\r\n   - **Branch:** Select the branch (e.g., `gh-pages`) and `/ (root)` folder.\r\n4. Click **Save**.\r\n\r\nAfter a few seconds, GitHub Pages will publish your site!\r\n\r\n\u003e ⚠️ Make sure that the branch you're deploying to (`gh-pages` by default) is **not ignored** in your `.gitignore`.\r\n\r\n---\r\n\r\n## 🔗 Bonus Tips\r\n\r\n- For **custom domains**, update the `--cname` flag in your deploy script.\r\n- For **project pages**, use a non-empty `basePath` and `assetPrefix`.\r\n- You can even automate deploys using GitHub Actions for CI/CD.\r\n\r\n---\r\n\r\n## 📦 Example Repo\r\n\r\nHere’s a working example: [sky4689524.github.io](https://github.com/sky4689524/sky4689524.github.io)\r\n\r\n---\r\n\r\n## 🧰 Tools Used\r\n\r\n- [Next.js 13+](https://nextjs.org/)\r\n- [gh-pages](https://www.npmjs.com/package/gh-pages)\r\n- [shx](https://www.npmjs.com/package/shx)\r\n"])</script><script>self.__next_f.push([1,"9:[\"$\",\"$L12\",null,{\"posts\":[{\"slug\":\"fixing_nextJS_Github_pages\",\"title\":\"Fixing JS and CSS Not Loading in Next.js on GitHub Pages\",\"date\":\"$D2025-03-31T00:00:00.000Z\",\"tags\":[\"web-development\"],\"content\":\"$13\"}]}]\n"])</script><script>self.__next_f.push([1,"e:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\nb:null\n"])</script><script>self.__next_f.push([1,"c:null\n10:[[\"$\",\"title\",\"0\",{\"children\":\"Blog\"}],[\"$\",\"link\",\"1\",{\"rel\":\"icon\",\"href\":\"/favicon.ico\",\"type\":\"image/x-icon\",\"sizes\":\"16x16\"}]]\n"])</script></body></html>
